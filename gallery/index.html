---
layout: default
nav: photos
title: Gallery
---

<div id="gallery-app">
    <div id="gallery-index" class="galleries"></div>
    <div id="gallery-detail" style="display:none">
        <p><a href="#" id="gallery-back">&larr; Back to Galleries</a></p>
        <h3 id="gallery-title"></h3>
        <div id="gallery-images" class="gallery-grid"></div>
    </div>
    <div id="gallery-loading">Loading galleries&hellip;</div>
</div>

<div id="gallery-lightbox">
    <div class="lightbox-content">
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-prev" title="Previous">&lsaquo;</button>
        <button class="lightbox-next" title="Next">&rsaquo;</button>
        <button class="lightbox-close" title="Close">&times;</button>
    </div>
</div>

<style>
    .gallery-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .gallery-grid a {
        flex: 0 0 200px;
        height: 200px;
        overflow: hidden;
        border: 1px solid #000;
        text-decoration: none;
    }
    .gallery-grid a img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.2s;
    }
    .gallery-grid a:hover img {
        transform: scale(1.05);
    }

    #gallery-lightbox {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.92);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
    }
    #gallery-lightbox.active {
        display: flex;
    }
    .lightbox-content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 60px;
    }
    .lightbox-content img {
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
        display: block;
    }
    .lightbox-prev, .lightbox-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.5);
        color: #fff;
        border: none;
        font-size: 48px;
        padding: 10px 18px;
        cursor: pointer;
        line-height: 1;
        z-index: 10;
    }
    .lightbox-prev:hover, .lightbox-next:hover {
        background: rgba(0,0,0,0.8);
    }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    .lightbox-close {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0,0,0,0.5);
        border: none;
        color: #fff;
        font-size: 36px;
        cursor: pointer;
        line-height: 1;
        padding: 5px 15px;
        z-index: 10;
    }
    .lightbox-close:hover {
        background: rgba(0,0,0,0.8);
    }

    @media (max-width: 640px) {
        .gallery-grid a {
            flex: 0 0 calc(50% - 4px);
            height: 150px;
        }
        .lightbox-prev { left: 4px; }
        .lightbox-next { right: 4px; }
        .lightbox-prev, .lightbox-next {
            font-size: 32px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.6);
        }
    }

    #gallery-back {
        color: #000;
    }
</style>

<script>
// -- Configuration --
// Set this to wherever your gallery images and galleries.json are hosted.
var S3_BASE = 'https://content.duelingmonkeys.com/gallery';

var galleriesData = null;
var currentImages = [];
var currentIndex = 0;

function init() {
    if (galleriesData) {
        route();
        return;
    }

    var xhr = new XMLHttpRequest();
    xhr.open('GET', S3_BASE + '/galleries.json');
    xhr.onload = function () {
        if (xhr.status === 200) {
            galleriesData = JSON.parse(xhr.responseText);
            document.getElementById('gallery-loading').style.display = 'none';
            route();
        } else {
            document.getElementById('gallery-loading').textContent =
                'Gallery is temporarily unavailable.';
        }
    };
    xhr.onerror = function () {
        document.getElementById('gallery-loading').textContent =
            'Gallery is temporarily unavailable.';
    };
    xhr.send();
}

function route() {
    if (window.location.hash && window.location.hash.length > 1) {
        var name = window.location.hash.slice(1);
        var gallery = findGallery(name);
        if (gallery) {
            showGallery(gallery);
            return;
        }
    }
    showIndex();
}

function findGallery(name) {
    for (var i = 0; i < galleriesData.galleries.length; i++) {
        if (galleriesData.galleries[i].name === name) return galleriesData.galleries[i];
    }
    return null;
}

function showIndex() {
    var el = document.getElementById('gallery-index');
    var detail = document.getElementById('gallery-detail');
    el.style.display = '';
    detail.style.display = 'none';
    window.location.hash = '';

    var html = '';
    for (var i = 0; i < galleriesData.galleries.length; i++) {
        var g = galleriesData.galleries[i];
        html += '<a href="#' + g.name + '"'
            + ' style="background-image:url(\'' + S3_BASE + '/' + g.name + '/' + g.cover + '\')">'
            + '<h3>' + g.title + '</h3>'
            + '</a>';
    }
    el.innerHTML = html;
}

function showGallery(gallery) {
    document.getElementById('gallery-index').style.display = 'none';
    document.getElementById('gallery-detail').style.display = '';
    document.getElementById('gallery-title').textContent = gallery.title;
    window.location.hash = gallery.name;

    currentImages = [];
    var html = '';
    for (var i = 0; i < gallery.images.length; i++) {
        var img = gallery.images[i];
        var full = S3_BASE + '/' + gallery.name + '/' + img;
        var thumb = full;
        currentImages.push(full);
        html += '<a href="' + full + '" data-index="' + i + '">'
            + '<img src="' + thumb + '" alt="' + img + '" loading="lazy">'
            + '</a>';
    }
    document.getElementById('gallery-images').innerHTML = html;
    
    // Add click handlers to gallery images
    var links = document.querySelectorAll('#gallery-images a');
    for (var i = 0; i < links.length; i++) {
        links[i].addEventListener('click', function (e) {
            e.preventDefault();
            openLightbox(parseInt(this.getAttribute('data-index')));
        });
    }
}

function openLightbox(index) {
    currentIndex = index;
    document.getElementById('lightbox-img').src = currentImages[currentIndex];
    document.getElementById('gallery-lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    document.getElementById('gallery-lightbox').classList.remove('active');
    document.body.style.overflow = '';
}

function navLightbox(dir) {
    currentIndex = (currentIndex + dir + currentImages.length) % currentImages.length;
    document.getElementById('lightbox-img').src = currentImages[currentIndex];
}

document.addEventListener('keydown', function (e) {
    if (document.getElementById('gallery-lightbox').classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
    }
});

window.addEventListener('hashchange', function () {
    if (galleriesData) route();
});

// Handle click-away to close lightbox
document.addEventListener('click', function (e) {
    var lightbox = document.getElementById('gallery-lightbox');
    if (lightbox.classList.contains('active') && e.target === lightbox) {
        closeLightbox();
    }
});

// Handle lightbox button clicks
document.querySelector('.lightbox-prev').addEventListener('click', function (e) {
    e.stopPropagation();
    navLightbox(-1);
});

document.querySelector('.lightbox-next').addEventListener('click', function (e) {
    e.stopPropagation();
    navLightbox(1);
});

document.querySelector('.lightbox-close').addEventListener('click', function (e) {
    e.stopPropagation();
    closeLightbox();
});

// Handle back to gallery index
document.getElementById('gallery-back').addEventListener('click', function (e) {
    e.preventDefault();
    window.location.hash = '';
});

init();
</script>
